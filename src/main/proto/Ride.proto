syntax = "proto3";

package com.example.RideMateXSocket;

option java_multiple_files = true;
option java_package = "com.example.RideMateXSocket";
option java_outer_classname = "Ride";

message RideAcceptanceRequest {
  int32 ride_id = 1;
  int32 driver_id = 2;
}

message RideAcceptanceResponse {
  bool success = 1;
}

service RideService {
  rpc AcceptRide (RideAcceptanceRequest) returns (RideAcceptanceResponse);
}

service RideNotificationService {
  rpc NotifyDriverForNewRide (RideNotificationRequest) returns (RideNotificationResponse);
}

message RideNotificationRequest {
  repeated int32 driver_ids = 1;
  int32 booking_id = 2;
  string pickup_location_latitude = 3;
  string pickup_location_longitude = 4;
}

message RideNotificationResponse {
  bool success = 1;
}